# 信息源配置：改这里就等于接入新源，不用改代码。
#
# 实测状态（2026-11-17，用 scripts/list_structure.py --sel= 验证）：
#   jwc    教务处      服务端渲染 OK   li.news                        命中 15 条
#   xsc    学生工作部   服务端渲染 OK   div.tzgg-item-title             命中  8 条（首页通知区）
#   tw     校团委      服务端渲染 OK   div.col-md-9.col-sm-9.col-xs-9  命中 15 条
#   informatics 信息学院  浏览器渲染（Vue+axios）→ kind: browser
#               静态 HTML 里 0 篇文章链接，必须用无头 Chromium 渲染后再取
#               需要先装 playwright，否则该源会被跳过（其它源照常）
#
# 字段：id / list_url / item_selector / content_selector / encoding / kind / detail_limit
#   kind: html（默认，服务端渲染）| rss | browser（浏览器渲染）
# 只选「通知公告」类栏目，不要选「新闻/学院动态」——新闻没有可行动价值。

- id: jwc
  list_url: https://jwc.xmu.edu.cn/tzgg.htm
  item_selector: li.news
  content_selector: .v_news_content
  encoding: utf-8
  kind: html
  detail_limit: 12
  enabled: true

# 学生工作部：奖学金、助学金、评优、资助、医保卡——大二最常错过的那类通知在这
- id: xsc
  list_url: https://xsc.xmu.edu.cn/
  item_selector: div.tzgg-item-title
  encoding: utf-8
  kind: html
  detail_limit: 12
  enabled: true

- id: tw
  list_url: https://tw.xmu.edu.cn/tzgg.htm
  item_selector: div.col-md-9.col-sm-9.col-xs-9
  encoding: utf-8
  kind: html
  detail_limit: 12
  enabled: true

# 信息学院：Vue 渲染，用浏览器采集器（需要 playwright）
- id: informatics
  list_url: https://informatics.xmu.edu.cn/news_events/tzgg.htm
  kind: browser
  limit: 15
  enabled: true

