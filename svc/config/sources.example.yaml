# 信息源配置：改这里就等于接入新源，不用改代码。
#
# 实测状态（2026-11-17，用 scripts/list_structure.py 验证）：
#   jwc          服务端渲染 OK   li.news 命中 15 条
#   tw           服务端渲染 OK   div.col-md-9... 命中 15 条
#   xaxq         服务端渲染 OK   div.news-list-title 命中 15 条
#   informatics  NO  Vue 动态渲染：HTML 里只有导航链接，0 条文章（/tzgg.htm 本身 404）
#                真实栏目是 /news_events/tzgg.htm 和 /xszx/announces.htm，但都是空壳
#                -> 要抓只能上 Playwright（V2），或以后扒它的 axios 接口
#
# 字段：id / list_url / item_selector / content_selector / encoding / kind / detail_limit
# 只选「通知公告」类栏目，不要选「新闻/学院动态」——新闻没有可行动价值。

- id: jwc
  list_url: https://jwc.xmu.edu.cn/tzgg.htm
  item_selector: li.news
  content_selector: .v_news_content
  encoding: utf-8
  kind: html
  detail_limit: 6
  enabled: true

- id: tw
  list_url: https://tw.xmu.edu.cn/tzgg.htm
  item_selector: div.col-md-9.col-sm-9.col-xs-9
  encoding: utf-8
  kind: html
  detail_limit: 6
  enabled: true

# 翔安校区通知（信息学院在这边，停水停电/班车/场馆类信息也在这里）
- id: xaxq
  list_url: https://xaxq.xmu.edu.cn/xqdt/tzgg.htm
  item_selector: div.news-list-title
  encoding: utf-8
  kind: html
  detail_limit: 4
  enabled: true

# ---- 信息学院：先留着，等 V2 上 Playwright 再打开 ----
- id: informatics
  list_url: https://informatics.xmu.edu.cn/news_events/tzgg.htm
  item_selector: div.news-list-title      # 仅占位：该页是 Vue 渲染，静态抓不到
  encoding: utf-8
  kind: html
  detail_limit: 0
  enabled: false

