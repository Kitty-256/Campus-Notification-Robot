# 信息源配置：改这里就等于接入新源，不用改代码。
# 字段说明：
#   id               源标识（会出现在日报与统计里）
#   list_url         列表页地址
#   item_selector    列表条目的 CSS 选择器（先 F12 看结构再填）
#   content_selector 详情页正文容器（留空则用通用抽取）
#   encoding         gbk / utf-8 / auto
#   kind             html | rss
#   detail_limit     每轮最多抓几个详情页（控制请求量）
#
# ⚠ 下面的 list_url 与选择器都是「待实测」的初始值：第一次跑起来后
#   按 docs/sources.md「怎么调选择器」逐个核对，改到能拿到正确标题为止。
# ⚠ 只选「通知公告」类栏目，不要选「新闻/学院动态」——新闻没有可行动价值。

- id: jwc
  list_url: https://jwc.xmu.edu.cn/tzgg.htm
  item_selector: ul.news_list li
  content_selector: .v_news_content
  encoding: gbk
  kind: html
  detail_limit: 6
  enabled: false          # 实测通过后改成 true

- id: informatics
  list_url: https://informatics.xmu.edu.cn/tzgg.htm
  item_selector: ul.news_list li
  encoding: utf-8
  kind: html
  detail_limit: 6
  enabled: false

# 校团委：竞赛、社会实践、活动报名
# 常见栏目名：通知公告 / 工作动态 / 团学活动（打开首页看导航，别猜）
- id: tw
  list_url: https://tw.xmu.edu.cn/tzgg.htm
  item_selector: ul.news_list li
  encoding: utf-8
  kind: html
  detail_limit: 6
  enabled: false

