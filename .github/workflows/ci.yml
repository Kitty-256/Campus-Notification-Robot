name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: python -m compileall -q svc plugin scripts

      - name: 纯函数自检（零依赖）
        run: python scripts/selftest.py

      - name: 端到端离线演练（零依赖）
        run: python scripts/dryrun.py

      - name: 安装依赖并验证服务可导入
        run: |
          python -m pip install -q -r svc/requirements.txt
          python - <<'PY'
          import sys
          sys.path.insert(0, "svc")
          from app.main import app
          from app import pipeline, parse, dedup
          assert app.title == "notice-svc"
          print("import ok:", app.title)
          PY

      - name: 检查是否误提交敏感文件
        run: |
          if git ls-files | grep -E '^(data/|logs/)|^\.env$'; then
            echo "::error::data/、logs/、.env 不允许进仓库"
            exit 1
          fi
          echo "敏感文件检查通过"
